[project]
name = "ascent-rate-limiter"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.144.0",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "locust>=2.46.7",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
